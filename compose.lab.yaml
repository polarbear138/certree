name: certree-lab
services:
  fixtures:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.lab
      target: mail
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /fixtures/ready && /lab -generate /fixtures && touch /fixtures/ready && exec sleep infinity"]
    volumes: ["fixtures:/fixtures"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /fixtures/ready"]
      interval: 1s
      timeout: 2s
      retries: 30
  nginx:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.lab
      target: nginx
    volumes: ["fixtures:/fixtures:ro"]
    depends_on:
      fixtures: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -s /srv/nginx/nginx.pid && test -d /run/sshd"]
      interval: 2s
      timeout: 2s
      retries: 30
  mail:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.lab
      target: mail
    volumes: ["fixtures:/fixtures:ro"]
    depends_on:
      fixtures: {condition: service_healthy}
  tests:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.lab
      target: runner
    volumes: ["fixtures:/fixtures:ro"]
    depends_on:
      nginx: {condition: service_healthy}
      mail: {condition: service_started}
volumes:
  fixtures:
