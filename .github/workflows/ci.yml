name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1', cache: true}
      - run: test -z "$(gofmt -l apps/server cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./apps/server
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1'}
      - uses: actions/setup-node@v4
        with: {node-version: '26', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: node scripts/validate-openapi.mjs
      - run: npm run lint && npm test && npm run build && npm audit --audit-level=high
        working-directory: apps/web
      - run: mkdir -p .cache && go build -o .cache/certree ./apps/server && go run ./cmd/lab -generate .cache/lab
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: apps/web
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          CERTREE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CERTREE_ADMIN_USER: ci-config-only
          CERTREE_ADMIN_PASSWORD: ci-config-only-no-deployment
      - run: docker compose -f compose.lab.yaml up --build --abort-on-container-exit --exit-code-from tests tests
      - if: always()
        run: docker compose -f compose.lab.yaml logs && docker compose -f compose.lab.yaml down -v
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
