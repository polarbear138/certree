name: certree
services:
  certree:
    build: .
    environment:
      CERTREE_MASTER_KEY: ${CERTREE_MASTER_KEY:?Run go run ./cmd/setup first}
      CERTREE_ADMIN_USER: ${CERTREE_ADMIN_USER:?Set initial admin username}
      CERTREE_ADMIN_PASSWORD: ${CERTREE_ADMIN_PASSWORD:?Set initial admin password}
      CERTREE_ORIGIN: ${CERTREE_ORIGIN:-https://localhost:8443}
      CERTREE_ADDRESS: 0.0.0.0:8080
      CERTREE_DB: /data/certree.db
      CERTREE_WEB_DIR: /app/web
    volumes:
      - certree_data:/data
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deployments/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      certree:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]
networks:
  private:
volumes:
  certree_data:
  caddy_data:
  caddy_config:
